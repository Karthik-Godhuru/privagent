<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PRIVAGENT</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h2>PRIVAGENT</h2>

  <p>Privacy-Preserving Browser AI Agent</p>

  <label for="command">What should PrivAgent do?</label>

  <input
    id="command"
    type="text"
    placeholder="Example: Click View Statement"
  >

  <button id="runButton">
    Run Agent
  </button>

  <button id="analyzeButton">
    Analyze Page
  </button>

  <button id="captureButton">
    Capture Screenshot
  </button>

  <img
    id="screenshotPreview"
    alt="Local screenshot preview"
    style="display: none; max-width: 100%; margin-top: 12px;"
  >

  <p id="status">Ready</p>

  <h3>Result</h3>

  <pre id="result">No action performed yet.</pre>

<script src="vendor/tesseract/api/package/dist/tesseract.min.js"></script>
<script src="ocr.js"></script>
<script src="popup.js"></script>

</body>
</html>
